<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Meta AI Grid</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-black flex justify-center items-center p-3 sm:p-5">

  <!-- MAIN PHONE / GALLERY -->
  <div class="bg-white w-full max-w-[330px] min-h-[580px] sm:max-w-[380px] md:max-w-[420px] lg:max-w-[450px]">

    <!-- NAV / SEARCH BAR -->
    <div class="bg-gray-200 w-[calc(100%-24px)] min-h-[40px] ml-3 mt-2 rounded-3xl px-3 flex items-center gap-2">

      <span class="text-xl shrink-0">⌕</span>

      <span class="text-gray-700 text-sm sm:text-base truncate">
        Search with Meta AI
      </span>

    </div>

    <!-- RESPONSIVE GRID -->
    <div class="grid grid-cols-3 gap-1 p-3 sm:p-4 mt-2 auto-rows-[100px] sm:auto-rows-[115px] md:auto-rows-[125px]">

      <!-- IMAGE 1 -->
      <div class="min-w-0 overflow-hidden">
        <img src="https://i.pinimg.com/736x/03/71/c0/0371c0d8c541d6453818a2cf352e156e.jpg" alt="Aesthetic image 1"
          loading="lazy" class="w-full h-full object-cover">
      </div>

      <!-- IMAGE 2 -->
      <div class="min-w-0 overflow-hidden">
        <img src="https://i.pinimg.com/1200x/9a/1e/40/9a1e40cc0cd06130e3130b29b055c3b9.jpg" alt="Aesthetic image 2"
          loading="lazy" class="w-full h-full object-cover">
      </div>

      <!-- VIDEO 1 -->
      <div class="row-span-2 min-w-0 overflow-hidden">
        <video class="w-full h-full object-cover" autoplay loop muted playsinline disablepictureinpicture>
          <source src="vidssave.com ✧┊ NARUTO - MINATO 720P.mp4" type="video/mp4">
        </video>
      </div>

      <!-- VIDEO 2 -->
      <div class="row-span-2 min-w-0 overflow-hidden">
        <video class="w-full h-full object-cover" autoplay loop muted playsinline disablepictureinpicture>
          <source
            src="vidssave.com Violet indian aesthetic _ Indian face claim violet, Video editing, Makeup tutorial 720P.mp4"
            type="video/mp4">
        </video>
      </div>

      <!-- IMAGE 3 -->
      <div class="min-w-0 overflow-hidden">
        <img src="https://i.pinimg.com/736x/0f/00/7a/0f007a555a7bdad488d7d45b4313b7c3.jpg" alt="Aesthetic image 3"
          loading="lazy" class="w-full h-full object-cover">
      </div>

      <!-- IMAGE 4 -->
      <div class="min-w-0 overflow-hidden">
        <img src="https://i.pinimg.com/736x/0b/68/62/0b6862c2ff503208ed9a43dfca1a3874.jpg" alt="Aesthetic image 4"
          loading="lazy" class="w-full h-full object-cover">
      </div>

      <!-- IMAGE 5 -->
      <div class="min-w-0 overflow-hidden">
        <img src="https://i.pinimg.com/736x/bd/ed/d9/bdedd9c9c55fefba0a2fd274733b6827.jpg" alt="Aesthetic image 5"
          loading="lazy" class="w-full h-full object-cover">
      </div>

      <!-- IMAGE 6 -->
      <div class="min-w-0 overflow-hidden">
        <img src="https://i.pinimg.com/736x/6e/9a/1d/6e9a1d9329fd511d4355ffaebca79cca.jpg" alt="Aesthetic image 6"
          loading="lazy" class="w-full h-full object-cover">
      </div>

      <!-- IMAGE 7 -->
      <div class="min-w-0 overflow-hidden">
        <img src="https://i.pinimg.com/736x/c0/c6/98/c0c698d7db489c5bc7abec1630acc029.jpg" alt="Aesthetic image 7"
          loading="lazy" class="w-full h-full object-cover">
      </div>

      <!-- image 8 -->

      <div class="min-w-0 overflow-hidden">
        <img src="https://i.pinimg.com/1200x/b6/f6/dc/b6f6dc9fd9fc7891863cd8c98f06508c.jpg" alt="Aesthetic image 8"
          loading="lazy" class="w-full h-full object-cover">
      </div>
    </div>

  </div>

</body>

</html>
